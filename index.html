<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    background: #f3f7fb;
    font-family: Arial, sans-serif;
    color: #1f2937;
  }

  form {
    max-width: 500px;
    margin: 0 auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }

  .title {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 30px;
  }

  .customer {
    text-align: center;
    margin-bottom: 25px;
    color: #374151;
  }

  .customer strong {
    color: #2563eb;
  }

  .rating {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
  }

  .rating label {
    cursor: pointer;
  }

  .rating input {
    display: none;
  }

  .rating span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 50px;
    border: 2px solid #dbe3ec;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.2s;
  }

  .rating input:checked + span {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }

  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    height: 50px;
    padding: 12px 15px;
    border: 2px solid #e1e7ef;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: #2563eb;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 120px;
    padding: 15px;
    border: 2px solid #e1e7ef;
    border-radius: 12px;
    resize: vertical;
    font-size: 16px;
    outline: none;
  }

  textarea:focus {
    border-color: #2563eb;
  }

  button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #1d4ed8;
  }

  button:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }

  .loading {
    text-align: center;
    color: #6b7280;
    padding: 30px;
  }

  .error {
    text-align: center;
    color: #dc2626;
    padding: 30px;
    line-height: 1.5;
  }
</style>

<title>EVA Reviews</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>

<body>

<form id="reviewForm">

  <div class="loading" id="loading">
    Загружаем данные...
  </div>

</form>


<script>

/* =========================================
   SUPABASE
   ========================================= */

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   НАСТРОЙКИ
   ========================================= */

const GET_REQUEST_URL =
  "https://vzwjpzjyhknqiowhpugu.supabase.co/functions/v1/get-review-request";


const params =
  new URLSearchParams(
    window.location.search
  );


const token =
  params.get("token");


const form =
  document.querySelector("#reviewForm");


/* =========================================
   ПРОВЕРЯЕМ TOKEN
   ========================================= */

if (!token) {

  form.innerHTML = `
    <div class="error">
      <h2>Ссылка недействительна</h2>
      <p>
        В ссылке отсутствует токен отзыва.
      </p>
    </div>
  `;

} else {

  loadReviewRequest();

}


/* =========================================
   ПОЛУЧАЕМ ДАННЫЕ ЗАПРОСА
   ========================================= */

async function loadReviewRequest() {

  try {

    const response =
      await fetch(
        `${GET_REQUEST_URL}?token=${encodeURIComponent(token)}`
      );


    const data =
      await response.json();


    console.log(
      "Данные review request:",
      data
    );


    if (
      !response.ok ||
      !data.success
    ) {

      form.innerHTML = `
        <div class="error">

          <h2>
            Ссылка недействительна
          </h2>

          <p>
            ${data.error || "Не удалось загрузить данные."}
          </p>

        </div>
      `;

      return;
    }


    const request =
      data.review_request;


    showReviewForm(request);


  } catch (error) {

    console.error(error);

    form.innerHTML = `
      <div class="error">

        <h2>
          Ошибка загрузки
        </h2>

        <p>
          Не удалось получить данные.
          Попробуйте открыть ссылку ещё раз.
        </p>

      </div>
    `;

  }

}


/* =========================================
   ПОКАЗЫВАЕМ ФОРМУ
   ========================================= */

function showReviewForm(request) {

  const customerName =
    request.customer_name || "";


  form.innerHTML = `

    <p class="title">
      Оцените сервис
    </p>

    <p class="subtitle">
      Ваше мнение очень важно для нас
    </p>

    ${
      customerName
        ? `
          <div class="customer">
            Отзыв для:
            <strong>
              ${escapeHtml(customerName)}
            </strong>
          </div>
        `
        : ""
    }


    <div class="rating">

      <label>
        <input
          type="radio"
          name="rating"
          value="1"
        >
        <span>1</span>
      </label>

      <label>
        <input
          type="radio"
          name="rating"
          value="2"
        >
        <span>2</span>
      </label>

      <label>
        <input
          type="radio"
          name="rating"
          value="3"
        >
        <span>3</span>
      </label>

      <label>
        <input
          type="radio"
          name="rating"
          value="4"
        >
        <span>4</span>
      </label>

      <label>
        <input
          type="radio"
          name="rating"
          value="5"
        >
        <span>5</span>
      </label>

    </div>


    <br>


    <p>
      Ваше имя:
    </p>

    <input
      type="text"
      id="name"
      name="name"
      placeholder="Введите ваше имя"
      value="${escapeHtml(customerName)}"
      required
    >


    <p>
      Оставьте комментарий:
    </p>

    <textarea
      id="comment"
      name="comment"
      placeholder="Напишите ваш отзыв"
      rows="5"
    ></textarea>


    <br>
    <br>


    <button
      type="submit"
      id="submitButton"
    >
      Отправить отзыв
    </button>

  `;


  const submitButton =
    document.querySelector(
      "#submitButton"
    );


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const rating =
        document.querySelector(
          'input[name="rating"]:checked'
        );


      const name =
        document
          .querySelector("#name")
          .value
          .trim();


      const comment =
        document
          .querySelector("#comment")
          .value
          .trim();


      if (!rating) {

        alert(
          "Пожалуйста, поставьте оценку."
        );

        return;
      }


      if (!comment) {

        alert(
          "Пожалуйста, оставьте комментарий."
        );

        return;
      }


      submitButton.disabled = true;

      submitButton.textContent =
        "Отправляем...";


      /* =====================================
         СОХРАНЯЕМ ОТЗЫВ
         ===================================== */

      const {
        error: reviewError
      } =
        await supabaseClient
          .from("reviews")
          .insert([
            {

              rating:
                Number(
                  rating.value
                ),

              name:
                name,

              comment:
                comment,

              amocrm_account_id:
                request.amocrm_account_id,

              amocrm_lead_id:
                request.amocrm_lead_id,

              amocrm_contact_id:
                request.amocrm_contact_id

            }
          ]);


      if (reviewError) {

        console.error(
          reviewError
        );

        submitButton.disabled =
          false;

        submitButton.textContent =
          "Отправить отзыв";

        alert(
          "Не удалось отправить отзыв. Попробуйте ещё раз."
        );

        return;
      }


      /* =====================================
         ПОМЕЧАЕМ ССЫЛКУ КАК ИСПОЛЬЗОВАННУЮ
         ===================================== */

      const {
        error: requestError
      } =
        await supabaseClient
          .from("review_requests")
          .update({
            status: "used",
            used_at:
              new Date().toISOString()
          })
          .eq(
            "token",
            token
          );


      /*
         Если здесь будет ошибка,
         отзыв всё равно уже сохранён.
      */

      if (requestError) {

        console.error(
          "Ошибка обновления review request:",
          requestError
        );

      }


      /* =====================================
         УСПЕШНАЯ ОТПРАВКА
         ===================================== */

      form.innerHTML = `

        <div
          style="
            text-align: center;
            padding: 30px;
          "
        >

          <div
            style="
              font-size: 50px;
            "
          >
            ❤️
          </div>

          <h2>
            Спасибо за ваш отзыв!
          </h2>

          <p
            style="
              color: #6b7280;
            "
          >
            Ваше мнение очень важно для нас.
          </p>

        </div>

      `;

    }
  );

}


/* =========================================
   ЗАЩИТА ОТ HTML
   ========================================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
