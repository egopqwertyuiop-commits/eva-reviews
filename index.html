<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    background: #f3f7fb;
    font-family: Arial, sans-serif;
    color: #1f2937;
  }

  form {
    max-width: 500px;
    margin: 0 auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }

  .title {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 30px;
  }

  .rating {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
  }

  .rating label {
    cursor: pointer;
  }

  .rating input {
    display: none;
  }

  .rating span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 50px;
    border: 2px solid #dbe3ec;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.2s;
  }

  .rating input:checked + span {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 120px;
    padding: 15px;
    border: 2px solid #e1e7ef;
    border-radius: 12px;
    resize: vertical;
    font-size: 16px;
    outline: none;
  }

  textarea:focus {
    border-color: #2563eb;
  }

  button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #1d4ed8;
  }
</style>
<title>EVA Reviews</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<form>
  <p>Оцените сервис</p>
<div class="rating">

  <label>
    <input type="radio" name="rating" value="1">
    <span>1</span>
  </label>

  <label>
    <input type="radio" name="rating" value="2">
    <span>2</span>
  </label>

  <label>
    <input type="radio" name="rating" value="3">
    <span>3</span>
  </label>

  <label>
    <input type="radio" name="rating" value="4">
    <span>4</span>
  </label>

  <label>
    <input type="radio" name="rating" value="5">
    <span>5</span>
  </label>

</div>

<br>

<p>Оставьте комментарий:</p>

<textarea
  id="comment"
  name="comment"
  placeholder="Напишите ваш отзыв"
  rows="5"
></textarea>

<br><br>

<button type="submit">Отправить отзыв</button>

</form>

<script>
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.querySelector("form");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const rating = document.querySelector(
      'input[name="rating"]:checked'
    );

    const comment = document
      .querySelector("#comment")
      .value
      .trim();

    if (!rating) {
      alert("Пожалуйста, поставьте оценку.");
      return;
    }

    if (!comment) {
      alert("Пожалуйста, оставьте комментарий.");
      return;
    }

    const { error } = await supabaseClient
      .from("reviews")
      .insert([
        {
          rating: Number(rating.value),
          comment: comment
        }
      ]);

    if (error) {
      console.error(error);
      alert("Не удалось отправить отзыв. Попробуйте ещё раз.");
      return;
    }

    form.innerHTML = `
      <div style="text-align: center; padding: 30px;">
        <div style="font-size: 50px;">❤️</div>

        <h2>Спасибо за ваш отзыв!</h2>

        <p style="color: #6b7280;">
          Ваше мнение очень важно для нас.
        </p>
      </div>
    `;
  });
</script>

</body>
</html>
