<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EVA Reviews — Панель</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef6ff;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .login-container {
      max-width: 420px;
      margin: 100px auto;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .login-container h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .login-description {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .input:focus {
      border-color: #2563eb;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    .error {
      margin-top: 15px;
      color: #dc2626;
      text-align: center;
      font-size: 14px;
    }

    .dashboard {
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
    }

    .logout-button {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-button:hover {
      background: #dc2626;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .stat-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    .distribution {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .distribution h2 {
      margin-top: 0;
    }

    .rating-row {
      display: grid;
      grid-template-columns: 70px 1fr 40px;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
    }

    .rating-label {
      font-weight: bold;
    }

    .bar {
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 10px;
    }

    .review {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .rating {
      font-size: 18px;
    }
    .name {
  font-size: 15px;
  font-weight: 700;
  color: #1f2937;
  margin-bottom: 6px;
}

    .comment {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .date {
      color: #9ca3af;
      font-size: 13px;
    }

    .delete-button {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .delete-button:hover {
      background: #fecaca;
    }

    .refresh-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh-button:hover {
      background: #1d4ed8;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 16px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
        padding: 15px;
      }

      .header {
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .review-top {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- ========================= -->
  <!-- ФОРМА ВХОДА -->
  <!-- ========================= -->

  <div id="loginContainer" class="login-container">

    <h1>🔐 EVA Reviews</h1>

    <div class="login-description">
      Войдите в панель управления отзывами
    </div>

    <form id="loginForm">

      <input
        id="email"
        class="input"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="Пароль"
        required
      >

      <button
        class="login-button"
        type="submit"
      >
        Войти
      </button>
      <button
  type="button"
  id="forgotPasswordButton"
  style="
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: none;
    background: transparent;
    color: #2563eb;
    font-size: 14px;
    cursor: pointer;
  "
>
  Забыли пароль?
</button>

      <div
        id="loginError"
        class="error"
      ></div>

    </form>

  </div>


  <!-- ========================= -->
  <!-- ПАНЕЛЬ АДМИНИСТРАТОРА -->
  <!-- ========================= -->

  <div
    id="dashboard"
    class="dashboard"
  >

    <div class="container">

      <div class="header">

        <h1>EVA Reviews</h1>

        <button
          class="logout-button"
          onclick="logout()"
        >
          Выйти
        </button>

      </div>


      <!-- СТАТИСТИКА -->

      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            Средняя оценка
          </div>

          <div
            id="average"
            class="stat-value"
          >
            —
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Всего отзывов
          </div>

          <div
            id="count"
            class="stat-value"
          >
            0
          </div>

        </div>

      </div>


      <!-- РАСПРЕДЕЛЕНИЕ -->

      <div class="distribution">

        <h2>
          Оценки
        </h2>

        <div id="distribution"></div>

      </div>


      <!-- ОТЗЫВЫ -->

      <div id="reviews"></div>


      <!-- ОБНОВИТЬ -->

      <button
        class="refresh-button"
        onclick="loadReviews()"
      >
        🔄 Обновить отзывы
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================= -->

  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
      const forgotPasswordButton =
  document.querySelector("#forgotPasswordButton");

forgotPasswordButton.addEventListener("click", async function () {

  const email = document.querySelector("#email").value.trim();

  if (!email) {
    alert("Сначала введите ваш Email.");
    return;
  }

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo:
        "https://egopqwertyuiop-commits.github.io/eva-reviews/update-password.html"
    });

  if (error) {
    console.error(error);
    alert("Не удалось отправить письмо: " + error.message);
    return;
  }

  alert(
    "Письмо для восстановления пароля отправлено на " +
    email
  );

});


    let reviews = [];


    const loginContainer =
      document.querySelector("#loginContainer");

    const dashboard =
      document.querySelector("#dashboard");

    const loginForm =
      document.querySelector("#loginForm");

    const loginError =
      document.querySelector("#loginError");


    const reviewsContainer =
      document.querySelector("#reviews");

    const averageElement =
      document.querySelector("#average");

    const countElement =
      document.querySelector("#count");

    const distributionElement =
      document.querySelector("#distribution");


    // =========================
    // ПРОВЕРКА АВТОРИЗАЦИИ
    // =========================

    async function checkAuth() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (session) {

        showDashboard();

      } else {

        showLogin();

      }

    }


    // =========================
    // ПОКАЗАТЬ ВХОД
    // =========================

    function showLogin() {

      loginContainer.style.display = "block";

      dashboard.style.display = "none";

    }


    // =========================
    // ПОКАЗАТЬ ПАНЕЛЬ
    // =========================

    function showDashboard() {

      loginContainer.style.display = "none";

      dashboard.style.display = "block";

      loadReviews();

    }


    // =========================
    // ВХОД
    // =========================

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        loginError.textContent = "";


        const email =
          document.querySelector("#email").value.trim();


        const password =
          document.querySelector("#password").value;


        const { error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          console.error(error);

          loginError.textContent =
            "Неверный email или пароль.";

          return;

        }


        showDashboard();

      }
    );


    // =========================
    // ВЫХОД
    // =========================

    async function logout() {

      await supabaseClient.auth.signOut();

      showLogin();

    }


    // =========================
    // ЗАГРУЗКА ОТЗЫВОВ
    // =========================

    async function loadReviews() {

      const { data, error } =
        await supabaseClient
          .from("reviews")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        reviewsContainer.innerHTML = `
          <div class="empty">
            Не удалось загрузить отзывы.
          </div>
        `;

        return;

      }


      reviews = data || [];

      render();

    }


    // =========================
    // ОТРИСОВКА
    // =========================

    function render() {

      countElement.textContent =
        reviews.length;


      if (reviews.length === 0) {

        averageElement.textContent = "—";

        distributionElement.innerHTML = "";

        reviewsContainer.innerHTML = `
          <div class="empty">
            Пока отзывов нет.
          </div>
        `;

        return;

      }


      const total =
        reviews.reduce(
          (sum, review) => {

            return sum + Number(review.rating);

          },
          0
        );


      const average =
        (total / reviews.length).toFixed(1);


      averageElement.textContent =
        "⭐ " + average;


      renderDistribution();


      reviewsContainer.innerHTML = "";


      reviews.forEach((review) => {

        const stars =
          "⭐".repeat(
            Number(review.rating)
          );


        const reviewElement =
          document.createElement("div");


        reviewElement.className =
          "review";


        const date =
          new Date(
            review.created_at
          ).toLocaleString("ru-RU");


        reviewElement.innerHTML = `

          <div class="review-top">

            <div class="rating">
              ${stars}
            </div>

            <button
              class="delete-button"
              onclick="deleteReview('${review.id}')"
            >
              🗑 Удалить
            </button>

          </div>
          <div class="name">
  ${escapeHtml(review.name || "Без имени")}
</div>


          <div class="comment">
            ${escapeHtml(review.comment)}
          </div>


          <div class="date">
            ${date}
          </div>

        `;


        reviewsContainer.appendChild(
          reviewElement
        );

      });

    }


    // =========================
    // РАСПРЕДЕЛЕНИЕ ОЦЕНОК
    // =========================

    function renderDistribution() {

      distributionElement.innerHTML = "";


      for (
        let rating = 5;
        rating >= 1;
        rating--
      ) {

        const count =
          reviews.filter(
            review =>
              Number(review.rating) === rating
          ).length;


        const percentage =
          reviews.length === 0
            ? 0
            : (count / reviews.length) * 100;


        distributionElement.innerHTML += `

          <div class="rating-row">

            <div class="rating-label">
              ⭐ ${rating}
            </div>


            <div class="bar">

              <div
                class="bar-fill"
                style="width: ${percentage}%"
              ></div>

            </div>


            <div>
              ${count}
            </div>

          </div>

        `;

      }

    }


    // =========================
    // УДАЛЕНИЕ ОТЗЫВА
    // =========================

    async function deleteReview(id) {

      const confirmed =
        confirm(
          "Удалить этот отзыв?"
        );


      if (!confirmed) {

        return;

      }


      const { error } =
        await supabaseClient
          .from("reviews")
          .delete()
          .eq("id", id);


      if (error) {

        console.error(error);

        alert(
          "Не удалось удалить отзыв."
        );

        return;

      }


      await loadReviews();

    }


    // =========================
    // ЗАЩИТА ОТ HTML В ОТЗЫВАХ
    // =========================

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text || "";

      return div.innerHTML;

    }


    // =========================
    // СЛЕДИМ ЗА АВТОРИЗАЦИЕЙ
    // =========================

    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (session) {

          showDashboard();

        } else {

          showLogin();

        }

      }
    );


    // =========================
    // ЗАПУСК
    // =========================

    checkAuth();

  </script>

</body>
</html>
