<!DOCTYPE html>
<html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<head>
  <title>EVA Reviews — Панель</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #f3f7fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stat-title {
      color: #6b7280;
    }

    .distribution {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .distribution h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .rating-label {
      width: 50px;
    }

    .bar {
      flex: 1;
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 10px;
    }

    .reviews {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .review {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .rating {
      font-size: 20px;
    }

    .comment {
      font-size: 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .date {
      color: #9ca3af;
      font-size: 13px;
    }

    .delete-button {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .delete-button:hover {
      background: #fecaca;
    }

    .clear-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #dc2626;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .clear-button:hover {
      background: #b91c1c;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
      background: white;
      border-radius: 16px;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>EVA Reviews</h1>

  <div class="stats">

    <div class="stat">
      <div id="average" class="stat-number">—</div>
      <div class="stat-title">Средняя оценка</div>
    </div>

    <div class="stat">
      <div id="count" class="stat-number">0</div>
      <div class="stat-title">Всего отзывов</div>
    </div>

  </div>


  <div class="distribution">

    <h2>Распределение оценок</h2>

    <div id="distribution"></div>

  </div>


  <div id="reviews" class="reviews"></div>

<button
  onclick="loadReviews()"
  style="
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  "
>
  🔄 Обновить отзывы
</button>
  
</div>


<script>
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let reviews = [];


  const reviewsContainer =
    document.querySelector("#reviews");

  const averageElement =
    document.querySelector("#average");

  const countElement =
    document.querySelector("#count");

  const distributionElement =
    document.querySelector("#distribution");


  async function loadReviews() {

    const { data, error } = await supabaseClient
      .from("reviews")
      .select("*")
      .order("created_at", { ascending: false });


    if (error) {

      console.error(error);

      reviewsContainer.innerHTML = `
        <div class="empty">
          Не удалось загрузить отзывы.
        </div>
      `;

      return;
    }


    reviews = data || [];

    render();

  }


  function render() {

    countElement.textContent = reviews.length;


    if (reviews.length === 0) {

      averageElement.textContent = "—";

      distributionElement.innerHTML = "";

      reviewsContainer.innerHTML = `
        <div class="empty">
          Пока отзывов нет.
        </div>
      `;

      return;
    }


    const total = reviews.reduce((sum, review) => {

      return sum + Number(review.rating);

    }, 0);


    const average =
      (total / reviews.length).toFixed(1);


    averageElement.textContent =
      "⭐ " + average;


    renderDistribution();


    reviewsContainer.innerHTML = "";


    reviews.forEach((review) => {

      const stars =
        "⭐".repeat(Number(review.rating));


      const reviewElement =
        document.createElement("div");


      reviewElement.className = "review";


      const date =
        new Date(review.created_at)
          .toLocaleString("ru-RU");


      reviewElement.innerHTML = `

        <div class="review-top">

          <div class="rating">
            ${stars}
          </div>

        </div>

        <div class="comment">
          ${review.comment}
        </div>

        <div class="date">
          ${date}
        </div>

      `;


      reviewsContainer.appendChild(reviewElement);

    });

  }


  function renderDistribution() {

    distributionElement.innerHTML = "";


    for (let rating = 5; rating >= 1; rating--) {

      const count =
        reviews.filter(
          review => Number(review.rating) === rating
        ).length;


      const percentage =
        reviews.length === 0
          ? 0
          : (count / reviews.length) * 100;


      distributionElement.innerHTML += `

        <div class="rating-row">

          <div class="rating-label">
            ⭐ ${rating}
          </div>

          <div class="bar">

            <div
              class="bar-fill"
              style="width: ${percentage}%"
            ></div>

          </div>

          <div>
            ${count}
          </div>

        </div>

      `;

    }

  }


  loadReviews();

</script>

</body>
</html>
