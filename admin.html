<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVA Reviews — Панель</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(147,197,253,0.25), transparent 35%),
        #eef6ff;
      color: #111827;
    }

    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 20px;
    }

    .login-container {
      max-width: 420px;
      margin: 100px auto;
      padding: 30px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 15px 45px rgba(37,99,235,0.10);
    }

    .login-container h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .login-description {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.10);
    }

    .login-button,
    .refresh-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-button:hover,
    .refresh-button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .error {
      margin-top: 15px;
      color: #dc2626;
      text-align: center;
      font-size: 14px;
    }

    .dashboard {
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .logout-button {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-button:hover {
      background: #dc2626;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }

    .stat-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: bold;
    }

    .distribution {
      background: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }

    .distribution h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .rating-row {
      display: grid;
      grid-template-columns: 70px 1fr 40px;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
    }

    .rating-label {
      font-weight: bold;
    }

    .bar {
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .filters {
      background: rgba(255,255,255,0.85);
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.04);
      display: grid;
      grid-template-columns: 1fr 180px 200px;
      gap: 10px;
    }

    .filter-input,
    .filter-select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      background: white;
      font-size: 14px;
      outline: none;
    }

    .filter-input:focus,
    .filter-select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.08);
    }

    .review {
      position: relative;
      background: white;
      padding: 22px;
      border-radius: 20px;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
      border: 1px solid rgba(229,231,235,0.8);
      transition: 0.2s;
    }

    .review:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(37,99,235,0.08);
    }

    .review.hidden-review {
      opacity: 0.72;
      border: 1px dashed #9ca3af;
      background: #f9fafb;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .review-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dbeafe;
      color: #2563eb;
      font-size: 18px;
      font-weight: bold;
    }

    .review-meta {
      min-width: 0;
    }

    .name {
      font-size: 16px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .date {
      color: #9ca3af;
      font-size: 13px;
    }

    .rating {
      font-size: 17px;
      white-space: nowrap;
    }

    .hidden-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #4b5563;
      font-size: 12px;
      font-weight: bold;
    }

    .comment {
      font-size: 16px;
      line-height: 1.6;
      color: #374151;
      background: #f8fafc;
      border-radius: 13px;
      padding: 14px 16px;
      margin-top: 4px;
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .review-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .review-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .rating-label-small {
      color: #6b7280;
      font-size: 13px;
    }

    .hide-button,
    .delete-button {
      border: none;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .hide-button {
      background: #e0f2fe;
      color: #0369a1;
    }

    .hide-button:hover {
      background: #bae6fd;
    }

    .hide-button.show {
      background: #dcfce7;
      color: #15803d;
    }

    .hide-button.show:hover {
      background: #bbf7d0;
    }

    .delete-button {
      background: #fee2e2;
      color: #dc2626;
    }

    .delete-button:hover {
      background: #fecaca;
    }

    .refresh-button {
      margin-top: 20px;
    }

    .empty {
      background: white;
      padding: 35px 25px;
      text-align: center;
      border-radius: 18px;
      color: #6b7280;
      box-shadow: 0 8px 25px rgba(0,0,0,0.04);
    }

    @media (max-width: 700px) {
      .container {
        margin: 20px auto;
        padding: 15px;
      }

      .header {
        align-items: flex-start;
      }

      .header h1 {
        font-size: 25px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .review-top {
        flex-direction: column;
      }

      .review-left {
        width: 100%;
      }

      .review-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .review-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .rating {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>

  <div id="loginContainer" class="login-container">
    <h1>🔐 EVA Reviews</h1>

    <div class="login-description">
      Войдите в панель управления отзывами
    </div>

    <form id="loginForm">
      <input
        id="email"
        class="input"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="Пароль"
        required
      >

      <button class="login-button" type="submit">
        Войти
      </button>

      <button
        type="button"
        id="forgotPasswordButton"
        style="
          width: 100%;
          margin-top: 12px;
          padding: 12px;
          border: none;
          background: transparent;
          color: #2563eb;
          font-size: 14px;
          cursor: pointer;
        "
      >
        Забыли пароль?
      </button>

      <div id="loginError" class="error"></div>
    </form>
  </div>


  <div id="dashboard" class="dashboard">

    <div class="container">

      <div class="header">
        <h1>EVA Reviews</h1>

        <button class="logout-button" onclick="logout()">
          Выйти
        </button>
      </div>


      <div class="stats">

        <div class="stat">
          <div class="stat-title">
            Средняя оценка
          </div>

          <div id="average" class="stat-value">
            —
          </div>
        </div>

        <div class="stat">
          <div class="stat-title">
            Отзывов по фильтру
          </div>

          <div id="count" class="stat-value">
            0
          </div>
        </div>

      </div>


      <div class="distribution">
        <h2>Оценки</h2>
        <div id="distribution"></div>
      </div>


      <div class="filters">

        <input
          id="searchInput"
          class="filter-input"
          type="text"
          placeholder="🔎 Поиск по имени или отзыву..."
        >

        <select id="ratingFilter" class="filter-select">
          <option value="all">Все оценки</option>
          <option value="5">⭐ 5</option>
          <option value="4">⭐ 4</option>
          <option value="3">⭐ 3</option>
          <option value="2">⭐ 2</option>
          <option value="1">⭐ 1</option>
        </select>

        <select id="sortSelect" class="filter-select">
          <option value="newest">Сначала новые</option>
          <option value="oldest">Сначала старые</option>
          <option value="rating-high">Оценка: высокая → низкая</option>
          <option value="rating-low">Оценка: низкая → высокая</option>
        </select>

      </div>


      <div id="reviews"></div>


      <button class="refresh-button" onclick="loadReviews()">
        🔄 Обновить отзывы
      </button>

    </div>

  </div>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const forgotPasswordButton =
      document.querySelector("#forgotPasswordButton");

    forgotPasswordButton.addEventListener("click", async function () {

      const email =
        document.querySelector("#email").value.trim();

      if (!email) {
        alert("Сначала введите ваш Email.");
        return;
      }

      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo:
            "https://egopqwertyuiop-commits.github.io/eva-reviews/update-password.html"
        });

      if (error) {
        console.error(error);
        alert("Не удалось отправить письмо: " + error.message);
        return;
      }

      alert(
        "Письмо для восстановления пароля отправлено на " +
        email
      );

    });


    let reviews = [];


    const loginContainer =
      document.querySelector("#loginContainer");

    const dashboard =
      document.querySelector("#dashboard");

    const loginForm =
      document.querySelector("#loginForm");

    const loginError =
      document.querySelector("#loginError");

    const reviewsContainer =
      document.querySelector("#reviews");

    const averageElement =
      document.querySelector("#average");

    const countElement =
      document.querySelector("#count");

    const distributionElement =
      document.querySelector("#distribution");

    const searchInput =
      document.querySelector("#searchInput");

    const ratingFilter =
      document.querySelector("#ratingFilter");

    const sortSelect =
      document.querySelector("#sortSelect");


    async function checkAuth() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session) {
        showDashboard();
      } else {
        showLogin();
      }

    }


    function showLogin() {

      loginContainer.style.display = "block";
      dashboard.style.display = "none";

    }


    function showDashboard() {

      loginContainer.style.display = "none";
      dashboard.style.display = "block";

      loadReviews();

    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        loginError.textContent = "";

        const email =
          document.querySelector("#email").value.trim();

        const password =
          document.querySelector("#password").value;

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          console.error(error);

          loginError.textContent =
            "Неверный email или пароль.";

          return;

        }

        showDashboard();

      }
    );


    async function logout() {

      await supabaseClient.auth.signOut();

      showLogin();

    }


    async function loadReviews() {

      const { data, error } =
        await supabaseClient
          .from("reviews")
          .select("*")
          .order("created_at", {
            ascending: false
          });

      if (error) {

        console.error(error);

        reviewsContainer.innerHTML = `
          <div class="empty">
            Не удалось загрузить отзывы.
          </div>
        `;

        return;

      }

      reviews = data || [];

      render();

    }


    function getFilteredReviews() {

      const search =
        searchInput.value.trim().toLowerCase();

      const selectedRating =
        ratingFilter.value;

      let filtered =
        reviews.filter((review) => {

          const name =
            String(review.name || "").toLowerCase();

          const comment =
            String(review.comment || "").toLowerCase();

          const matchesSearch =
            !search ||
            name.includes(search) ||
            comment.includes(search);

          const matchesRating =
            selectedRating === "all" ||
            Number(review.rating) === Number(selectedRating);

          return matchesSearch && matchesRating;

        });


      const sort =
        sortSelect.value;

      filtered.sort((a, b) => {

        if (sort === "oldest") {
          return new Date(a.created_at) - new Date(b.created_at);
        }

        if (sort === "rating-high") {
          return Number(b.rating) - Number(a.rating);
        }

        if (sort === "rating-low") {
          return Number(a.rating) - Number(b.rating);
        }

        return new Date(b.created_at) - new Date(a.created_at);

      });

      return filtered;

    }


    function render() {

      const filteredReviews =
        getFilteredReviews();


      countElement.textContent =
        filteredReviews.length;


      if (filteredReviews.length === 0) {

        averageElement.textContent = "—";

        distributionElement.innerHTML = "";

        if (reviews.length === 0) {

          reviewsContainer.innerHTML = `
            <div class="empty">
              Пока отзывов нет.
            </div>
          `;

        } else {

          reviewsContainer.innerHTML = `
            <div class="empty">
              По выбранным фильтрам ничего не найдено.
            </div>
          `;

        }

        return;

      }


      const total =
        filteredReviews.reduce(
          (sum, review) =>
            sum + Number(review.rating),
          0
        );


      const average =
        (total / filteredReviews.length).toFixed(1);


      averageElement.textContent =
        "⭐ " + average;


      renderDistribution(filteredReviews);


      reviewsContainer.innerHTML = "";


      filteredReviews.forEach((review) => {

        const rating =
          Number(review.rating);

        const stars =
          "⭐".repeat(rating);

        const date =
          new Date(
            review.created_at
          ).toLocaleString("ru-RU");


        const name =
          String(review.name || "Без имени");

        const avatarLetter =
          name.trim() === "Без имени"
            ? "?"
            : name.trim().charAt(0).toUpperCase();


        const reviewElement =
          document.createElement("div");

        reviewElement.className =
          review.is_hidden
            ? "review hidden-review"
            : "review";


        reviewElement.innerHTML = `

          <div class="review-top">

            <div class="review-left">

              <div class="avatar">
                ${escapeHtml(avatarLetter)}
              </div>

              <div class="review-meta">

                <div class="name">
                  ${escapeHtml(name)}
                </div>

                <div class="date">
                  ${date}
                </div>

                ${
                  review.is_hidden
                    ? `<div class="hidden-badge">👁️ Отзыв скрыт</div>`
                    : ""
                }

              </div>

            </div>

            <div class="rating">
              ${stars}
            </div>

          </div>


          <div class="comment">
            ${escapeHtml(review.comment)}
          </div>


          <div class="review-footer">

            <div class="rating-label-small">
              Оценка: ${rating} из 5
            </div>

            <div class="review-actions">

              <button
                class="hide-button ${review.is_hidden ? "show" : ""}"
                onclick="toggleHidden('${review.id}', ${review.is_hidden ? "true" : "false"})"
              >
                ${review.is_hidden ? "👁 Показать" : "🙈 Скрыть"}
              </button>

              <button
                class="delete-button"
                onclick="deleteReview('${review.id}')"
              >
                🗑 Удалить
              </button>

            </div>

          </div>

        `;


        reviewsContainer.appendChild(
          reviewElement
        );

      });

    }


    function renderDistribution(list) {

      distributionElement.innerHTML = "";


      for (
        let rating = 5;
        rating >= 1;
        rating--
      ) {

        const count =
          list.filter(
            review =>
              Number(review.rating) === rating
          ).length;


        const percentage =
          list.length === 0
            ? 0
            : (count / list.length) * 100;


        distributionElement.innerHTML += `

          <div class="rating-row">

            <div class="rating-label">
              ⭐ ${rating}
            </div>

            <div class="bar">

              <div
                class="bar-fill"
                style="width: ${percentage}%"
              ></div>

            </div>

            <div>
              ${count}
            </div>

          </div>

        `;

      }

    }


    async function toggleHidden(id, currentHidden) {

      const newHidden =
        !currentHidden;

      const actionText =
        newHidden
          ? "скрыть"
          : "показать";

      const confirmed =
        confirm(
          `Вы уверены, что хотите ${actionText} этот отзыв?`
        );

      if (!confirmed) {
        return;
      }


      const { error } =
        await supabaseClient
          .from("reviews")
          .update({
            is_hidden: newHidden
          })
          .eq("id", id);


      if (error) {

        console.error(error);

        alert(
          "Не удалось изменить видимость отзыва."
        );

        return;

      }


      await loadReviews();

    }


    async function deleteReview(id) {

      const confirmed =
        confirm(
          "Удалить этот отзыв навсегда?"
        );

      if (!confirmed) {
        return;
      }


      const { error } =
        await supabaseClient
          .from("reviews")
          .delete()
          .eq("id", id);


      if (error) {

        console.error(error);

        alert(
          "Не удалось удалить отзыв."
        );

        return;

      }


      await loadReviews();

    }


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text || "";

      return div.innerHTML;

    }


    searchInput.addEventListener(
      "input",
      render
    );

    ratingFilter.addEventListener(
      "change",
      render
    );

    sortSelect.addEventListener(
      "change",
      render
    );


    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (session) {
          showDashboard();
        } else {
          showLogin();
        }

      }
    );


    checkAuth();

  </script>

</body>
</html>
